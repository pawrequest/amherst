[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"


[project]
name = "amherst"
version = "0.3.102"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paw", email = "amherst+pawrequest@users.noreply.github.com" }
]
requires-python = ">= 3.13"

dependencies = [
    "shipaw<0.4.0",
    "pawlogger==0.1.11",
    "pycommence<0.3.0",
    #
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "fastapi>=0.162.4",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "flaskwebgui>=1.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]


[project.scripts]
shipper = "amherst.cli2:shipper_cli"

[tool.ruff]
line-length = 120
lint.extend-select = ["RUF100", "UP", "I"]
format.quote-style = "single"



